[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lim"
version = "0.1.0.dev0"
description = "Linear Inverse Model for climate prediction, with cyclostationary support and a weekly sea-ice pipeline."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LIM contributors" }]
keywords = ["LIM", "climate", "sea-ice", "EOF", "stochastic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "xarray>=2024.1",
    "netCDF4>=1.6",
    "dask[array]>=2024.1",
    "cftime>=1.6",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "hypothesis",
    "ruff",
    "mypy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src"]
plugins = []

[[tool.mypy.overrides]]
module = ["scipy.*", "netCDF4.*", "cftime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
